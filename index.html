<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-Manager</title>
    <style>
        /* 1. Global Box-Sizing & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 2. Main Grid Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr 350px;
            grid-template-rows: 50px 1fr;
            height: 100vh;
            padding: 10px;
            gap: 10px;
        }

        .container > div {
            background-color: #f1f1f1;
            border: 1px solid black;
            padding: 10px;
            font-size: 24px;
        }

        /* 3. Header spanning full width */
        .header {
            grid-column: 1 / 3;
            display: flex;
            align-items: center;
            border-radius: 10px;
        }

        /* 4. Left Area (Today Section) */
        .main-today {
            background-image: url('https://picsum.photos/1200/800');
            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: space-between; /* Keeps "Today" left, buttons right */
            align-items: flex-start;
            padding: 15px;
            color: white;
            font-weight: bold;
            border-radius: 10px;
        }

        /* Container to keep Add and Delete buttons together */
        .card-actions {
            display: flex;
            gap: 8px; /* Spacing between Add and Delete buttons */
        }

        /* Shared Button Styling */
        .btn {
            padding: 6px 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #000;
            background-color: #ffffff;
            color: #000;
        }

        .btn-delete {
            background-color: #ff4d4d;
            color: white;
            border-color: #cc0000;
        }

        /* 5. Right Sidebar Stack */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 !important;
            border: none !important;
            background: transparent !important;
        }

        .sidebar-card {
            flex: 1;
            background-color: #f1f1f1;
            border: 1px solid black;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">Task Manager</div>

        <!-- Main Image Area -->
        <div class="main-today">
            <span>Today</span>
            
            <!-- Action Buttons Container -->
            <div class="card-actions">
                <button class="btn">add</button>
                <button class="btn btn-delete">delete</button>
            </div>
        </div>

        <!-- Right Sidebar Stack -->
        <div class="sidebar">
            <div class="sidebar-card">Pending for form</div>
            <div class="sidebar-card">Upcoming</div>
        </div>
    </div>
</body>
</html>
